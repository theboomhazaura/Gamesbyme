<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocktorium Launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; background: #0f111a; font-family: monospace; color: #fff; overflow: hidden; }
    
    #launcher-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    h1 { font-size: 2.5rem; margin-bottom: 10px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
    p { color: #8b9bb4; margin-bottom: 30px; }

    .version-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .version-card {
      background: #1a1e29;
      border: 2px solid #2a324b;
      padding: 20px 30px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      max-width: 250px;
    }

    .version-card:hover {
      border-color: #00ffcc;
      transform: translateY(-4px);
      box-shadow: 0 5px 20px rgba(0,255,204,0.2);
    }

    .version-card h3 { font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
    .version-card span { font-size: 0.85rem; color: #00ffcc; display: block; line-height: 1.3; }

    #gameFrame { width: 100%; height: 100%; border: none; display: none; position: absolute; top: 0; left: 0; }
    #loader { display: none; text-align: center; font-size: 20px; color: #00ffcc; margin-top: 40vh; font-weight: bold; }
    
    #backBtn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
      background: rgba(26, 30, 41, 0.85);
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      font-weight: bold;
    }
    #backBtn:hover { background: #00ffcc; color: #0f111a; }
  </style>
</head>
<body>

  <button id="backBtn" onclick="location.reload()">◀ Launcher</button>

  <div id="launcher-container">
    <h1>SELECT VERSION</h1>
    <p>Choose your preferred build to launch</p>
    <div class="version-grid" id="versionGrid"></div>
  </div>

  <div id="loader">⚡ Assembling version chunks in browser RAM...</div>
  <iframe id="gameFrame"></iframe>

  <!-- Load your external configuration -->
  <script src="launcher.js"></script>
  <script>
    // Populate version cards on load
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("versionGrid");
      VERSIONS.forEach(ver => {
        const card = document.createElement("div");
        card.className = "version-card";
        card.onclick = () => launchVersion(ver.id);
        card.innerHTML = `<h3>${ver.title}</h3><span>${ver.description}</span>`;
        grid.appendChild(card);
      });
    });

    async function launchVersion(versionId) {
      document.getElementById('launcher-container').style.display = 'none';
      document.getElementById('loader').style.display = 'block';

      // Find the selected version object from launcher.js
      const selected = VERSIONS.find(v => v.id === versionId);
      if (!selected) throw new Error("Version not found!");

      try {
        const responses = await Promise.all(selected.chunks.map(url => fetch(url)));
        for (const res of responses) {
          if (!res.ok) throw new Error(`Failed to fetch chunk: ${res.status}`);
        }

        const buffers = await Promise.all(responses.map(res => res.arrayBuffer()));
        const htmlBlob = new Blob(buffers, { type: "text/html" });
        const htmlUrl = URL.createObjectURL(htmlBlob);

        const frame = document.getElementById('gameFrame');
        frame.src = htmlUrl;
        frame.style.display = 'block';
        document.getElementById('loader').style.display = 'none';
        document.getElementById('backBtn').style.display = 'block';

        frame.onload = () => {
          frame.contentWindow.focus();
        };
      } catch (err) {
        document.getElementById('loader').innerText = "❌ Launch failed: " + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
