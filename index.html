<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adless - no ads ever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">no ads in games, EVER!</p>
    <h1 class="hero-title">Adless</h1>
    <p class="hero-sub">Pick a cartridge, hit play. </p>
  </div>
</header>

<main class="shelf" id="shelf">

 <script>
  // Instant Panic Switch
  window.addEventListener('keydown', (e) => {
    if (e.key === '~') {
      window.location.href = 'https://docs.google.com';
    }
  });

  // Cloak tab name/icon on button click
  function cloakTab() {
    document.title = "My Drive - Google Drive";
    let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
    link.type = 'image/x-icon';
    link.rel = 'shortcut icon';
    link.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
    document.getElementsByTagName('head')[0].appendChild(link);
  }
</script> 
  
<!-- Cartridge cards are rendered here by script.js -->
</main>

<footer class="site-footer">
  <p>Adless - no ads in games</p>
</footer>

<script src="games.js"></script>
<script src="script.js"></script>
</body>
</html>
