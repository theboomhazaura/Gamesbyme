<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play — The Shelf</title>
<style>
  html, body { margin: 0; height: 100%; background: #211A2E; }
  iframe { width: 100%; height: 100%; border: none; display: block; }
  .back { position: fixed; top: 10px; left: 10px; z-index: 10;
          background: rgba(0,0,0,0.6); color: #EFE8DA; padding: 6px 12px;
          border-radius: 6px; text-decoration: none; font-family: sans-serif; font-size: 0.85rem; }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; Shelf</a>
  <iframe id="frame" allowfullscreen></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');
    if (src) {
      document.getElementById('frame').src = src;
    }
  </script>

 <script>
  // GLOBAL INSTANT PANIC SWITCH
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Backquote' || e.key === '~') {
      window.location.href = 'https://docs.google.com';
    }
  });
</script> 


</body>
</html>
