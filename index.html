<header class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">don't get caught</p>
    <h1 class="hero-title">UNBLOCKTORIUM</h1>
    <p class="hero-sub">Pick a cartridge, hit play. </p>
  </div>
</header>

<main class="shelf" id="shelf">

 <script>
  // Instant Panic Switch
  window.addEventListener('keydown', (e) => {
    if (e.key === '~') {
      window.location.href = 'https://docs.google.com';
    }
  });

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Title that shows up in search results -->
  <title>The Shelf | Unblocked Games & Custom Creations</title>
  
  <!-- Description snippet under the title on Google -->
  <meta name="description" content="Play unblocked games including Geometry Dash Lite, Five Nights at Freddy's, and custom games directly in your browser.">
  
  <!-- Keywords to help search engines classify your site -->
  <meta name="keywords" content="unblocked games, geometry dash, fnaf, browser games, Unblocktorium, games hub">
</head>
   
  // Cloak tab name/icon on button click
  function cloakTab() {
    document.title = "My Drive - Google Drive";
    let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
    link.type = 'image/x-icon';
    link.rel = 'shortcut icon';
    link.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
    document.getElementsByTagName('head')[0].appendChild(link);
  }
</script> 

<style>
    /* Tab Navigation Styling */
    .tab-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    .tab-btn {
      background: #18181b;
      color: #a1a1aa;
      border: 2px solid #27272a;
      padding: 10px 22px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }

    .tab-btn:hover {
      color: #ffffff;
      border-color: #3f3f46;
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: #00ff88;
      color: #000000;
      border-color: #00ff88;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }

    /* Shelf Grid Container */
    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Game Card Layout */
    .game-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: #1e1e24;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d2d35;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .game-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .game-card h3 {
      margin: 12px 12px 4px 12px;
      font-size: 1.1rem;
    }

    .game-card p {
      margin: 0 12px 12px 12px;
      font-size: 0.85rem;
      color: #a1a1aa;
    }

    /* Color accents matching your script */
    .game-card.teal { border-bottom: 4px solid #14b8a6; }
    .game-card.moss { border-bottom: 4px solid #84cc16; }
    .game-card.clay { border-bottom: 4px solid #f97316; }
  </style>
</head>
<body>

  <div class="tab-container">
    <button class="tab-btn active" onclick="filterCategory(event, 'all')">Home</button>
    <button class="tab-btn" onclick="filterCategory(event, 'GAMESBYME')">GAMESBYME</button>
    <button class="tab-btn" onclick="filterCategory(event, 'Horror')">Horror</button>
    <button class="tab-btn" onclick="filterCategory(event, 'Platformer')">Platformer</button>
    <button class="tab-btn" onclick="filterCategory(event, 'other')">other</button> 
    <button class="tab-btn" onclick="filterCategory(event, 'Driving')">Driving</button>
    <button class="tab-btn" onclick="filterCategory(event, 'Idle')">Idle</button>
    <button class="tab-btn" onclick="filterCategory(event, 'Shooter')">Shooter</button>
  </div>

  <main id="shelf-container" class="shelf-grid"></main>

  <script>
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Backquote' || e.key === '~') {
        window.location.href = 'https://docs.google.com';
      }
    });
  </script>
  
<!-- Cartridge cards are rendered here by script.js -->
</main>

<footer class="site-footer">
  <p>Adless - no ads in games</p>
</footer>

<script src="script.js"></script>
</body>
</html>
