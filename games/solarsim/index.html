<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Skibidi Solar System: Final Boss</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Courier New', monospace; 
        }
        #ui { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: #fff; 
            pointer-events: none; 
            z-index: 100; 
            background: rgba(0,0,0,0.7); 
            padding: 10px; 
            border: 1px solid #0f0; 
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: auto;
        }
        #modeToggle {
            padding: 15px 30px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            border: 2px solid #0f0;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }
        #modeToggle:hover {
            background: #0f0;
            color: #000;
        }
        #modeToggle.blackhole {
            border-color: #ff00ff;
            color: #ff00ff;
        }
        #modeToggle.blackhole:hover {
            background: #ff00ff;
            color: #000;
        }
        #modeToggle.planet {
            border-color: #00ffff;
            color: #00ffff;
        }
        #modeToggle.planet:hover {
            background: #00ffff;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="ui">
        WARP STATUS: SIGMA<br>
        SUN GRAVITY: ENABLED<br>
        MODE: <span id="currentMode">ASTEROID</span><br>
        PROJECTILES: <span id="projCount">0</span><br>
        CHAOS LEVEL: <span id="chaosLevel">0</span><br>
        DESTROYED: <span id="destroyCount">0</span>
    </div>

    <div id="controls">
        <button id="modeToggle">MODE: ASTEROID</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));

        const sun = new THREE.Mesh(
            new THREE.SphereGeometry(20, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffaa00 })
        );
        scene.add(sun);
        
        const sunGlow = new THREE.Mesh(
            new THREE.SphereGeometry(22, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.3 })
        );
        scene.add(sunGlow);

        const planets = [];
        const orbitLines = [];
        let chaosHits = 0;
        let destroyedCount = 0;
        let launchMode = 'asteroid'; // 'asteroid', 'blackhole', or 'planet'
        
        // Sun properties
        const sunData = {
            mass: 1000,
            velocity: new THREE.Vector3(0, 0, 0),
            chaotic: false,
            health: 1000
        };
        
        function createPlanet(name, radius, color, dist, speed, hasRings = false, moonCount = 0, rotSpeed = 0.01) {
            const pivot = new THREE.Object3D();
            pivot.rotation.y = Math.random() * Math.PI * 2; 
            scene.add(pivot);

            const orbitGeo = new THREE.BufferGeometry();
            const orbitPoints = [];
            for(let i = 0; i <= 128; i++) {
                const angle = (i / 128) * Math.PI * 2;
                orbitPoints.push(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
            }
            orbitGeo.setAttribute('position', new THREE.Float32BufferAttribute(orbitPoints, 3));
            const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.3 }));
            scene.add(orbitLine);
            orbitLines.push(orbitLine);

            const geometry = new THREE.IcosahedronGeometry(radius, 12);
            const pos = geometry.attributes.position;
            const colors = [];
            const baseCol = new THREE.Color(color);

            for (let i = 0; i < pos.count; i++) {
                let v = new THREE.Vector3().fromBufferAttribute(pos, i);
                let noise = Math.sin(v.x * 3) * Math.cos(v.y * 3);
                v.multiplyScalar(1 + Math.max(0, noise) * 0.2);
                pos.setXYZ(i, v.x, v.y, v.z);
                const tempCol = baseCol.clone();
                if (name === "Earth" && noise > 0) tempCol.setHex(0x228B22);
                colors.push(tempCol.r, tempCol.g, tempCol.b);
            }

            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true }));
            mesh.position.x = dist;
            pivot.add(mesh);

            if (hasRings) {
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(radius * 1.5, radius * 3, 32),
                    new THREE.MeshBasicMaterial({ color: 0x887766, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
                );
                ring.rotation.x = Math.PI / 2.5;
                mesh.add(ring);
            }

            const moons = [];
            for(let m = 0; m < moonCount; m++) {
                const moonPivot = new THREE.Object3D();
                moonPivot.rotation.y = Math.random() * Math.PI * 2;
                mesh.add(moonPivot);
                
                const moonRadius = radius * (0.15 + Math.random() * 0.15);
                const moonDist = radius * (2 + m * 0.8);
                const moonMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(moonRadius, 8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x999999, flatShading: true })
                );
                moonMesh.position.x = moonDist;
                moonPivot.add(moonMesh);
                
                moons.push({ pivot: moonPivot, speed: 0.02 + Math.random() * 0.02 });
            }

            const mass = radius * radius * radius;
            planets.push({ 
                pivot, 
                mesh, 
                speed, 
                radius, 
                name, 
                rotSpeed, 
                moons,
                mass: mass,
                velocity: new THREE.Vector3(0, 0, 0),
                chaotic: false,
                health: 100,
                destroyed: false
            });
        }

        createPlanet("Mercury", 2, 0xaaaaaa, 50, 0.02, false, 0, 0.005);
        createPlanet("Venus", 3.5, 0xffcc33, 80, 0.015, false, 0, 0.002);
        createPlanet("Earth", 3.8, 0x2255ff, 110, 0.012, false, 1, 0.01);
        createPlanet("Mars", 2.5, 0xff4422, 140, 0.01, false, 2, 0.01);
        createPlanet("Jupiter", 12, 0xffaa88, 220, 0.006, false, 4, 0.02);
        createPlanet("Saturn", 10, 0xccbb99, 300, 0.004, true, 3, 0.018);
        createPlanet("Uranus", 5, 0x99ffff, 370, 0.003, false, 2, 0.012);
        createPlanet("Neptune", 4.8, 0x3366ff, 430, 0.002, false, 1, 0.011);

        const asteroidPivot = new THREE.Object3D();
        scene.add(asteroidPivot);
        for (let i = 0; i < 1000; i++) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            const d = 165 + Math.random() * 35;
            const a = Math.random() * Math.PI * 2;
            mesh.position.set(Math.cos(a) * d, (Math.random()-0.5)*15, Math.sin(a) * d);
            asteroidPivot.add(mesh);
        }

        const starV = [];
        for(let i=0; i<3000; i++) starV.push((Math.random()-0.5)*4000, (Math.random()-0.5)*4000, (Math.random()-0.5)*4000);
        const starGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(starV, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 2})));

        camera.position.set(0, 600, 800);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Mode toggle
        const modeToggle = document.getElementById('modeToggle');
        const currentModeDisplay = document.getElementById('currentMode');
        
        modeToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            if(launchMode === 'asteroid') {
                launchMode = 'blackhole';
                modeToggle.textContent = 'MODE: BLACK HOLE';
                modeToggle.classList.remove('planet');
                modeToggle.classList.add('blackhole');
                currentModeDisplay.textContent = 'BLACK HOLE';
            } else if(launchMode === 'blackhole') {
                launchMode = 'planet';
                modeToggle.textContent = 'MODE: PLANET';
                modeToggle.classList.remove('blackhole');
                modeToggle.classList.add('planet');
                currentModeDisplay.textContent = 'PLANET';
            } else {
                launchMode = 'asteroid';
                modeToggle.textContent = 'MODE: ASTEROID';
                modeToggle.classList.remove('planet');
                currentModeDisplay.textContent = 'ASTEROID';
            }
        });

        const projectiles = [];
        const blackHoles = [];
        const launchedPlanets = [];
        const explosionParticles = [];
        
        window.addEventListener('pointerdown', (e) => {
            if(e.target.id === 'modeToggle') return;
            
            const tap = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            const ray = new THREE.Raycaster();
            ray.setFromCamera(tap, camera);
            const target = new THREE.Vector3();
            ray.ray.at(1000, target);
            const dir = new THREE.Vector3().subVectors(target, camera.position).normalize();
            
            if(launchMode === 'asteroid') {
                const toilet = new THREE.Mesh(
                    new THREE.BoxGeometry(5,5,5), 
                    new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0x4444ff, emissiveIntensity: 0.5})
                );
                toilet.position.copy(camera.position);
                
                toilet.userData = { 
                    vel: dir.multiplyScalar(8),
                    trail: [],
                    type: 'asteroid'
                };
                scene.add(toilet);
                projectiles.push(toilet);
                document.getElementById('projCount').textContent = projectiles.length + blackHoles.length;
            } else {
                // Create black hole
                const blackHole = new THREE.Group();
                
                // Black hole core
                const core = new THREE.Mesh(
                    new THREE.SphereGeometry(8, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0x000000 })
                );
                blackHole.add(core);
                
                // Accretion disk
                const disk = new THREE.Mesh(
                    new THREE.RingGeometry(10, 25, 32),
                    new THREE.MeshBasicMaterial({ 
                        color: 0xff00ff, 
                        side: THREE.DoubleSide, 
                        transparent: true, 
                        opacity: 0.6 
                    })
                );
                disk.rotation.x = Math.PI / 2;
                blackHole.add(disk);
                
                // Event horizon glow
                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(12, 32, 32),
                    new THREE.MeshBasicMaterial({ 
                        color: 0x8800ff, 
                        transparent: true, 
                        opacity: 0.3 
                    })
                );
                blackHole.add(glow);
                
                blackHole.position.copy(camera.position);
                blackHole.userData = {
                    vel: dir.multiplyScalar(3),
                    mass: 5000,
                    type: 'blackhole',
                    disk: disk,
                    glow: glow
                };
                
                scene.add(blackHole);
                blackHoles.push(blackHole);
                document.getElementById('projCount').textContent = projectiles.length + blackHoles.length;
            } else {
                // Create launched planet
                const planetColors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff];
                const color = planetColors[Math.floor(Math.random() * planetColors.length)];
                const radius = 5 + Math.random() * 8;
                
                const geometry = new THREE.IcosahedronGeometry(radius, 12);
                const pos = geometry.attributes.position;
                const colors = [];
                const baseCol = new THREE.Color(color);

                for (let i = 0; i < pos.count; i++) {
                    let v = new THREE.Vector3().fromBufferAttribute(pos, i);
                    let noise = Math.sin(v.x * 3) * Math.cos(v.y * 3);
                    v.multiplyScalar(1 + Math.max(0, noise) * 0.2);
                    pos.setXYZ(i, v.x, v.y, v.z);
                    colors.push(baseCol.r, baseCol.g, baseCol.b);
                }

                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                const planetMesh = new THREE.Mesh(
                    geometry, 
                    new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true })
                );
                
                planetMesh.position.copy(camera.position);
                planetMesh.userData = {
                    vel: dir.multiplyScalar(6),
                    mass: radius * radius * radius,
                    radius: radius,
                    type: 'planet',
                    health: 100,
                    rotSpeed: 0.01 + Math.random() * 0.02,
                    destroyed: false
                };
                
                scene.add(planetMesh);
                launchedPlanets.push(planetMesh);
                document.getElementById('projCount').textContent = projectiles.length + blackHoles.length;
            }
        });

        function createExplosion(pos, color = 0xff6600) {
            for(let i = 0; i < 30; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 4, 4),
                    new THREE.MeshBasicMaterial({ color: color })
                );
                particle.position.copy(pos);
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 4
                );
                particle.userData = { vel: vel, life: 60 };
                scene.add(particle);
                explosionParticles.push(particle);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Update black holes
            blackHoles.forEach((bh, bhIdx) => {
                bh.position.add(bh.userData.vel);
                bh.userData.disk.rotation.z += 0.05;
                bh.userData.glow.scale.setScalar(1 + Math.sin(Date.now() * 0.005) * 0.2);
                
                // Black hole affects SUN
                const sunDistVec = new THREE.Vector3().subVectors(new THREE.Vector3(0,0,0), bh.position);
                const sunDist = sunDistVec.length();
                
                if(sunDist < 300) {
                    const bhForce = (bh.userData.mass * sunData.mass) / (sunDist * sunDist);
                    sunData.velocity.add(sunDistVec.clone().normalize().multiplyScalar(-bhForce * 0.0001));
                    
                    if(!sunData.chaotic && sunData.velocity.length() > 0.3) {
                        sunData.chaotic = true;
                        createExplosion(new THREE.Vector3(0,0,0), 0xffff00);
                    }
                }
                
                // Black hole affects planets
                planets.forEach((planet, pIdx) => {
                    if(planet.destroyed) return;
                    
                    const planetPos = new THREE.Vector3();
                    planet.mesh.getWorldPosition(planetPos);
                    const distVec = new THREE.Vector3().subVectors(bh.position, planetPos);
                    const dist = distVec.length();
                    
                    if(dist < 400) {
                        const bhForce = (bh.userData.mass * planet.mass) / (dist * dist);
                        planet.velocity.add(distVec.normalize().multiplyScalar(bhForce * 0.0002));
                        
                        if(!planet.chaotic && planet.velocity.length() > 0.3) {
                            planet.chaotic = true;
                            chaosHits++;
                            document.getElementById('chaosLevel').textContent = chaosHits;
                            createExplosion(planetPos, 0xffff00);
                        }
                    }
                    
                    // Spaghettification - planet gets destroyed if too close
                    if(dist < 30) {
                        createExplosion(planetPos, 0xff00ff);
                        createExplosion(planetPos, 0x000000);
                        scene.remove(planet.pivot);
                        planet.destroyed = true;
                        destroyedCount++;
                        document.getElementById('destroyCount').textContent = destroyedCount;
                    }
                });
                
                // Black hole affects other projectiles
                projectiles.forEach((proj, projIdx) => {
                    const distVec = new THREE.Vector3().subVectors(bh.position, proj.position);
                    const dist = distVec.length();
                    
                    if(dist < 200) {
                        const bhForce = bh.userData.mass / (dist * dist);
                        proj.userData.vel.add(distVec.normalize().multiplyScalar(bhForce * 0.01));
                    }
                    
                    if(dist < 15) {
                        scene.remove(proj);
                        if(proj.userData.trailLine) scene.remove(proj.userData.trailLine);
                        projectiles.splice(projIdx, 1);
                        document.getElementById('projCount').textContent = projectiles.length + blackHoles.length;
                    }
                });
            });
            
            // Update sun if chaotic
            if(sunData.chaotic) {
                sun.position.add(sunData.velocity);
                sunGlow.position.copy(sun.position);
                sunData.velocity.multiplyScalar(0.998);
            }
            
            planets.forEach((p1, idx1) => {
                if(p1.destroyed) return;
                
                if(p1.chaotic) {
                    const p1Pos = new THREE.Vector3();
                    p1.mesh.getWorldPosition(p1Pos);
                    
                    // Only apply sun gravity if sun is stable
                    if(!sunData.chaotic) {
                        const sunDistVec = new THREE.Vector3().subVectors(sun.position, p1Pos);
                        const sunDist = sunDistVec.length();
                        if(sunDist > 0.1) {
                            const sunForce = (sunData.mass * p1.mass) / (sunDist * sunDist);
                            p1.velocity.add(sunDistVec.normalize().multiplyScalar(sunForce * 0.001));
                        }
                    }
                    
                    planets.forEach((p2, idx2) => {
                        if(idx1 !== idx2 && !p2.destroyed) {
                            const p2Pos = new THREE.Vector3();
                            p2.mesh.getWorldPosition(p2Pos);
                            
                            const distVec = new THREE.Vector3().subVectors(p2Pos, p1Pos);
                            const dist = distVec.length();
                            
                            if(dist > 0.1) {
                                const force = (p1.mass * p2.mass) / (dist * dist);
                                p1.velocity.add(distVec.normalize().multiplyScalar(force * 0.00001));
                                
                                if(p2.chaotic) {
                                    p2.velocity.add(distVec.clone().normalize().multiplyScalar(-force * 0.00001));
                                } else {
                                    const perturbation = distVec.clone().normalize().multiplyScalar(-force * 0.00001);
                                    p2.velocity.add(perturbation);
                                    
                                    if(p2.velocity.length() > 0.5) {
                                        p2.chaotic = true;
                                        chaosHits++;
                                        document.getElementById('chaosLevel').textContent = chaosHits;
                                        createExplosion(p2Pos, 0xffff00);
                                    }
                                }
                            }
                            
                            if(dist < p1.radius + p2.radius + 5) {
                                const collisionVel = p1.velocity.clone().add(p2.velocity);
                                createExplosion(p1Pos, 0xff0000);
                                createExplosion(p2Pos, 0xff0000);
                                
                                p1.health -= 50;
                                p2.health -= 50;
                                
                                if(p1.health <= 0 && !p1.destroyed) {
                                    scene.remove(p1.pivot);
                                    p1.destroyed = true;
                                    destroyedCount++;
                                    document.getElementById('destroyCount').textContent = destroyedCount;
                                }
                                if(p2.health <= 0 && !p2.destroyed) {
                                    scene.remove(p2.pivot);
                                    p2.destroyed = true;
                                    destroyedCount++;
                                    document.getElementById('destroyCount').textContent = destroyedCount;
                                }
                                
                                const bounce = distVec.normalize().multiplyScalar(2);
                                p1.velocity.sub(bounce);
                                if(p2.chaotic) p2.velocity.add(bounce);
                            }
                        }
                    });
                    
                    const localVel = p1.pivot.worldToLocal(p1.velocity.clone());
                    p1.mesh.position.add(localVel);
                    p1.velocity.multiplyScalar(0.999);
                }
                
                if(!p1.chaotic) {
                    p1.pivot.rotation.y += p1.speed;
                }
                
                p1.mesh.rotation.y += p1.rotSpeed;
                
                p1.moons.forEach(moon => {
                    moon.pivot.rotation.y += moon.speed;
                });
            });
            
            asteroidPivot.rotation.y += 0.001;
            sunGlow.scale.setScalar(1 + Math.sin(Date.now() * 0.002) * 0.05);

            projectiles.forEach((p, i) => {
                if(!p.userData.trailLine) {
                    p.userData.trail = [];
                    p.userData.trailGeo = new THREE.BufferGeometry();
                    p.userData.trailLine = new THREE.Line(
                        p.userData.trailGeo,
                        new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 })
                    );
                    scene.add(p.userData.trailLine);
                }
                
                p.userData.trail.push(p.position.clone());
                if(p.userData.trail.length > 50) p.userData.trail.shift();
                
                const trailPoints = [];
                p.userData.trail.forEach(pt => trailPoints.push(pt.x, pt.y, pt.z));
                p.userData.trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(trailPoints, 3));

                const sunDistVec = new THREE.Vector3().subVectors(new THREE.Vector3(0,0,0), p.position);
                const sunDist = sunDistVec.length();
                if (sunDist > 20) {
                    const sunForce = 2000 / (sunDist * sunDist);
                    p.userData.vel.add(sunDistVec.normalize().multiplyScalar(sunForce));
                } else {
                    createExplosion(p.position, 0xff9900);
                    scene.remove(p);
                    scene.remove(p.userData.trailLine);
                    projectiles.splice(i, 1);
                    document.getElementById('projCount').textContent = projectiles.length + blackHoles.length;
                    return;
                }

                planets.forEach(planetObj => {
                    if(planetObj.destroyed) return;
                    
                    const planetPos = new THREE.Vector3();
                    planetObj.mesh.getWorldPosition(planetPos);
                    const distVec = new THREE.Vector3().subVectors(planetPos, p.position);
                    const dist = distVec.length();

                    if (dist < 200) {
                        const force = (planetObj.radius * 10) / (dist * dist);
                        p.userData.vel.add(distVec.normalize().multiplyScalar(force));
                    }

                    if (dist < planetObj.radius + 3) {
                        const impactForce = p.userData.vel.clone().multiplyScalar(0.3);
                        planetObj.velocity.add(impactForce);
                        
                        if(!planetObj.chaotic) {
                            planetObj.chaotic = true;
                            chaosHits++;
                            document.getElementById('chaosLevel').textContent = chaosHits;
                        }
                        
                        planetObj.health -= 20;
                        if(planetObj.health <= 0 && !planetObj.destroyed) {
                            createExplosion(planetPos, 0xff0000);
                            createExplosion(planetPos, 0xffaa00);
                            scene.remove(planetObj.pivot);
                            planetObj.destroyed = true;
                            destroyedCount++;
                            document.getElementById('destroyCount').textContent = destroyedCount;
                        }
                        
                        createExplosion(p.position, 0xff3300);
                        scene.remove(p);
                        scene.remove(p.userData.trailLine);
                        projectiles.splice(i, 1);
                        document.getElementById('projCount').textContent = projectiles.length + blackHoles.length;
                    }
                });

                p.position.add(p.userData.vel);
                p.rotation.x += 0.1;
                p.rotation.z += 0.05;
            });

            explosionParticles.forEach((particle, i) => {
                particle.userData.life--;
                particle.position.add(particle.userData.vel);
                particle.userData.vel.multiplyScalar(0.95);
                particle.material.opacity = particle.userData.life / 60;
                
                if(particle.userData.life <= 0) {
                    scene.remove(particle);
                    explosionParticles.splice(i, 1);
                }
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
