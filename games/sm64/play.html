<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Mario 64 - Otherverse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    canvas { width: 100%; height: 100%; outline: none; }
  </style>
</head>
<body>

  <!-- The canvas where the WebAssembly port renders the game -->
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      print: (text) => console.log(text),
      printErr: (text) => console.error(text),
    };
  </script>
  
  <!-- Load the compiled WebAssembly game script -->
  <script src="sm64.js"></script>
</body>
</html>
