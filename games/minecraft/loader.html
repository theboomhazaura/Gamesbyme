<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocktorium launcher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; background: #0f111a; font-family: monospace; color: #fff; overflow: hidden; }
    
    #launcher-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    h1 { font-size: 2.5rem; margin-bottom: 10px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
    p { color: #8b9bb4; margin-bottom: 30px; }

    .version-grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .version-card {
      background: #1a1e29;
      border: 2px solid #2a324b;
      padding: 20px 30px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .version-card:hover {
      border-color: #00ffcc;
      transform: translateY(-4px);
      box-shadow: 0 5px 20px rgba(0,255,204,0.2);
    }

    .version-card h3 { font-size: 1.2rem; margin-bottom: 5px; color: #fff; }
    .version-card span { font-size: 0.85rem; color: #00ffcc; }

    #gameFrame { width: 100%; height: 100%; border: none; display: none; position: absolute; top: 0; left: 0; }
    #loader { display: none; text-align: center; font-size: 20px; color: #00ffcc; margin-top: 40vh; }
  </style>
</head>
<body>

  <!-- Launcher UI -->
  <div id="launcher-container" id="hub">
    <h1>SELECT VERSION</h1>
    <p>Choose your preferred build to launch</p>
    <div class="version-grid">
      <div class="version-card" onclick="launchVersion('26.3')">
        <h3>26.3</h3>
        <span>current minecraft (heavy best for high end devices)</span>
      </div>
      <div class="version-card" onclick="launchVersion('minecraft alpha ')">
        <h3>minecraft alpha</h3>
        <span>simple and good for low end devices</span>
      </div>
    </div>
  </div>

  <div id="loader">⚡ Assembling version chunks in browser RAM...</div>
  <iframe id="gameFrame"></iframe>

  <script>
    async function launchVersion(version) {
      // Hide launcher, show loader
      document.getElementById('launcher-container').style.display = 'none';
      document.getElementById('loader').style.display = 'block';

      // Define chunk paths based on the selected version
      let chunkUrls = [];
      if (version === '26.3') {
        chunkUrls = ["eagle-part1.bin", "eagle-part2.bin", "eagle-part3.bin"];
      } else {
        chunkUrls = ["alpha-part1.bin"];
      }

      try {
        const responses = await Promise.all(chunkUrls.map(url => fetch(url)));
        for (const res of responses) {
          if (!res.ok) throw new Error(`Failed to fetch chunk: ${res.status}`);
        }

        const buffers = await Promise.all(responses.map(res => res.arrayBuffer()));
        const htmlBlob = new Blob(buffers, { type: "text/html" });
        const htmlUrl = URL.createObjectURL(htmlBlob);

        const frame = document.getElementById('gameFrame');
        frame.src = htmlUrl;
        frame.style.display = 'block';
        document.getElementById('loader').style.display = 'none';
      } catch (err) {
        document.getElementById('loader').innerText = "❌ Launch failed: " + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
